; AgIsoAuxInputs firmware - ESP32S3R8N8 CAN Board V1.0.0
;
; One env (+ an _ota variant) per device profile; all profiles run on the
; same board.
;
; Mixed arduino+espidf framework: espidf gives us AgIsoStack's TWAI plugin;
; arduino keeps Wire/Adafruit ADS1X15 for the inputs and WiFi/WebServer/
; ESP2SOTA for OTA. This mix needs two sdkconfig overrides (PlatformIO
; auto-picks up a file named sdkconfig.<envname>): CONFIG_FREERTOS_HZ=1000
; (arduino-esp32 hard requirement) and CONFIG_AUTOSTART_ARDUINO=y (without
; it, app_main() - which calls Arduino's setup()/loop() - compiles out
; entirely and the link fails with "undefined reference to app_main").
; The object pool is compiled in as a plain C byte array
; (src/object_pool/aux_n_pool_data.h, generated by tools/build_aux_pool.py)
; rather than linker-embedded: PlatformIO's board_build.embed_files
; mechanism turned out not to fire under this mixed-framework build.
; partitions.csv is the same OTA-capable layout as Arduino's default_8MB.csv,
; since that name isn't resolvable under ESP-IDF's CMake-based partition
; lookup.

[platformio]
default_envs = joystick

[env:joystick]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
framework = arduino, espidf
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#509a920cadff634612e8972158e1c293c9f372c7

[env:joystick_ota]
extends = env:joystick
build_flags =
    ${env:joystick.build_flags}
    -DENABLE_OTA_WEBSERVER
lib_deps =
    ${env:joystick.lib_deps}
    pangodream/ESP2SOTA @ ^1.0.1
