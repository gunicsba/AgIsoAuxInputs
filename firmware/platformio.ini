; AgIsoAuxInputs firmware - ESP32S3R8N8 CAN Board V1.0.0
;
; One env (+ an _ota variant) per device profile; all profiles run on the
; same board.
;
; Mixed arduino+espidf framework: espidf gives us AgIsoStack's TWAI plugin;
; arduino keeps Wire/Adafruit ADS1X15 for the inputs and WiFi/WebServer/
; ESP2SOTA for OTA. This mix needs two sdkconfig overrides (PlatformIO
; auto-picks up a file named sdkconfig.<envname>): CONFIG_FREERTOS_HZ=1000
; (arduino-esp32 hard requirement) and CONFIG_AUTOSTART_ARDUINO=y (without
; it, app_main() - which calls Arduino's setup()/loop() - compiles out
; entirely and the link fails with "undefined reference to app_main").
; The object pool is compiled in as a plain C byte array
; (src/object_pool/aux_n_pool_data.h, generated by tools/build_aux_pool.py)
; rather than linker-embedded: PlatformIO's board_build.embed_files
; mechanism turned out not to fire under this mixed-framework build.
; partitions.csv is the same OTA-capable layout as Arduino's default_8MB.csv,
; since that name isn't resolvable under ESP-IDF's CMake-based partition
; lookup.

[platformio]
default_envs = joystick

[env:joystick]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
framework = arduino, espidf
monitor_speed = 115200
; patch_agisostack.py fixes AgIsoStack's AUX-N input unit side (ISO 11783-6
; Annex J) in the downloaded library before it's compiled.
extra_scripts =
    pre:tools/git_version.py
    pre:tools/patch_agisostack.py
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#d118a2db54e4b51c9dda2824cab601ac4a134750

; `pio run -e joystick_ota -t ota` uploads over Wi-Fi (tools/ota_upload.py),
; to custom_ota_host unless --upload-port names another host/IP.
[env:joystick_ota]
extends = env:joystick
extra_scripts =
    ${env:joystick.extra_scripts}
    post:tools/ota_upload.py
custom_ota_host = joystick-auxn.local
build_flags =
    ${env:joystick.build_flags}
    -DENABLE_OTA_WEBSERVER
lib_deps =
    ${env:joystick.lib_deps}
    pangodream/ESP2SOTA @ ^1.0.1

; joystick_ota + a Wi-Fi/CAN bridge speaking the Proemion CANlink protocol on
; TCP port 30000 (src/canlink_bridge.h): a CANlink client becomes the VT, with
; or without anything else on the CAN bus. Its AP is 192.168.0.34.
[env:joystick_canlink]
extends = env:joystick_ota
build_flags =
    ${env:joystick_ota.build_flags}
    -DENABLE_CANLINK_BRIDGE

; TEST BUILD: joystick_canlink + the seeder controller from
; github.com/davidbalogh92/Isobus_ESP_seeder_V2 as a second working set on
; the same board - two implements (the AUX-N joystick and the seeder, each
; with its own NAME, address and VT client) behind one CANlink bridge. The
; seeder runs on simulated inputs (no machine I/O). Its pool is uploaded in
; custom_seeder_pool_parts Object Pool Transfers (tools/seeder_combo.py), and
; scaled in PSRAM. Needs the seeder repo checked out at custom_seeder_dir.
[env:joystick_seeder]
extends = env:joystick_canlink
extra_scripts =
    pre:tools/seeder_combo.py
    ${env:joystick_canlink.extra_scripts}
custom_seeder_dir = ../../Isobus_ESP_seeder_V2
custom_seeder_pool_parts = 4
build_flags =
    ${env:joystick_canlink.build_flags}
    -DENABLE_SEEDER_COMBO
    -Wno-error=missing-field-initializers
