name: Release

# Push a tag like v1.0.0 to publish a GitHub release with one ZIP per board
# and per enclosure (see tools/package_release.py), plus a full and an
# update firmware image per PlatformIO env (see tools/package_firmware.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package hardware
        run: python tools/package_release.py "${GITHUB_REF_NAME}"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool>=5,<6"

      - name: Build firmware
        run: pio run -d firmware -e joystick -e joystick_ota -e joystick_canlink

      - name: Package firmware
        run: python tools/package_firmware.py "${GITHUB_REF_NAME}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.bin
          generate_release_notes: true
