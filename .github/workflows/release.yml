name: Release

# Push a tag like v1.0.0 to publish a GitHub release with one ZIP per board
# and per enclosure (see tools/package_release.py).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package hardware
        run: python tools/package_release.py "${GITHUB_REF_NAME}"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
